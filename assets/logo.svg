<?xml version="1.0" encoding="UTF-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" viewBox="0 0 2048 2048" xml:space="preserve" style="background: transparent;">
  <defs>
    <radialGradient id="sxPlanet" cx="42%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#ffd9a0"/>
      <stop offset="38%" stop-color="#ff9a3c"/>
      <stop offset="72%" stop-color="#f2611d"/>
      <stop offset="100%" stop-color="#c23b0e"/>
    </radialGradient>
    <linearGradient id="sxRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe0b0"/>
      <stop offset="50%" stop-color="#ff8a2a"/>
      <stop offset="100%" stop-color="#e04d12"/>
    </linearGradient>
    <linearGradient id="sxRingBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b8480f"/>
      <stop offset="100%" stop-color="#7a2b08"/>
    </linearGradient>
    <radialGradient id="sxGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff8a2a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ambient glow -->
  <circle cx="1024" cy="1024" r="720" fill="url(#sxGlow)"/>

  <!-- ring: back half (behind planet) -->
  <g transform="rotate(-24 1024 1024)">
    <path d="M 1024 700
             a 620 210 0 0 0 0 648"
          fill="none" stroke="url(#sxRingBack)" stroke-width="70" stroke-linecap="round"/>
  </g>

  <!-- planet body -->
  <circle cx="1024" cy="1024" r="430" fill="url(#sxPlanet)"/>
  <!-- subtle bands -->
  <ellipse cx="1024" cy="960" rx="430" ry="52" fill="#ffffff" opacity="0.08"/>
  <ellipse cx="1024" cy="1120" rx="410" ry="46" fill="#7a2b08" opacity="0.18"/>
  <!-- highlight -->
  <circle cx="880" cy="880" r="150" fill="#ffffff" opacity="0.18"/>

  <!-- ring: front half (over planet) -->
  <g transform="rotate(-24 1024 1024)">
    <path d="M 1024 1348
             a 620 210 0 0 0 0 -648"
          fill="none" stroke="url(#sxRing)" stroke-width="70" stroke-linecap="round"/>
  </g>

  <!-- X mark accent -->
  <g stroke="#fff2e0" stroke-width="66" stroke-linecap="round" opacity="0.95">
    <line x1="1298" y1="1300" x2="1470" y2="1472"/>
    <line x1="1470" y1="1300" x2="1298" y2="1472"/>
  </g>
</svg>
