[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "saturnx-mcp"
version = "0.1.0"
description = "Offensive Security MCP Server for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "fastmcp>=3.4.5,<4",
    "mcp>=1.29,<2",
    "docker>=7.1,<8",
    # No fixed upstream release exists for GHSA-qpc3-8vqg-8g6w. SaturnX does
    # not call the affected run_module_with_output API and rejects CR/LF in all
    # option keys/values before RPC dispatch.
    "pymetasploit3==1.0.6",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28.1,<1",
    "defusedxml>=0.7.1,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[project.scripts]
saturnx = "saturnx.main:main"
saturnx-workspace = "saturnx.workspace_cli:main"

[tool.hatch.build]
# The acceptance suite and CI experiments are intentionally local-only.
exclude = [
    "tests",
    "tests/**",
    ".github",
    ".github/**",
]

[tool.hatch.build.targets.wheel]
packages = ["saturnx"]

[tool.hatch.build.targets.wheel.force-include]
"skills/saturnx-mcp" = "saturnx/_bundled_skill/saturnx-mcp"
"install.md" = "saturnx/_bundled_install.md"
".codex-plugin" = "saturnx/_bundled_plugin/.codex-plugin"
".claude-plugin" = "saturnx/_bundled_plugin/.claude-plugin"
".cursor-plugin" = "saturnx/_bundled_plugin/.cursor-plugin"
".mcp.json" = "saturnx/_bundled_plugin/.mcp.json"
"mcp.json" = "saturnx/_bundled_plugin/mcp.json"
"saturnx-mcp.json" = "saturnx/_bundled_plugin/saturnx-mcp.json"

[tool.hatch.build.targets.sdist.force-include]
"skills/saturnx-mcp" = "skills/saturnx-mcp"
"install.md" = "install.md"
".codex-plugin" = ".codex-plugin"
".claude-plugin" = ".claude-plugin"
".cursor-plugin" = ".cursor-plugin"
".mcp.json" = ".mcp.json"
"mcp.json" = "mcp.json"
"saturnx-mcp.json" = "saturnx-mcp.json"

[tool.ruff.lint]
# MCP, Docker, RPC, and setup-information entrypoints normalize heterogeneous
# third-party failures, while cleanup paths are best-effort. Those boundaries
# must catch Exception without swallowing BaseException; all other Ruff rules
# remain enabled.
ignore = ["BLE001", "S110"]
